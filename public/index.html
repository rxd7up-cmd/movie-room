<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Moscow ↔ Samara</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: #f5f5f5;
  background: #08090b;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      #292c35 0,
      transparent 35%
    ),
    #08090b;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: min(1100px, 100%);
  margin: auto;

  padding:
    max(20px, env(safe-area-inset-top))
    16px
    max(32px, env(safe-area-inset-bottom));
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;

  margin-bottom: 20px;
}

.eyebrow {
  opacity: .5;

  font-size: 11px;
  letter-spacing: .18em;
}

h1 {
  margin: 4px 0 0;

  font-size:
    clamp(26px, 6vw, 42px);
}

.presence {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.person {
  padding: 8px 11px;

  border: 1px solid #30333b;
  border-radius: 999px;

  opacity: .4;

  font-size: 13px;
}

.person.online {
  opacity: 1;
  border-color: #747985;
}

.person.online::before {
  content: "●";
  margin-right: 6px;
}

nav {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;

  margin-bottom: 18px;
}

nav button {
  min-height: 48px;

  padding: 10px;

  border: 1px solid #2c2f36;
  border-radius: 13px;

  color: white;
  background: #14161a;
}

nav button.active {
  color: #111;
  background: #fff;

  font-weight: 700;
}

.panel {
  display: none;
}

.panel.active {
  display: block;
}

.videoShell {
  position: relative;

  width: 100%;
  aspect-ratio: 16 / 9;

  overflow: hidden;

  border: 1px solid #292c32;
  border-radius: 18px;

  background: #000;
}

#youtubePlayer,
#youtubePlayer iframe,
#screenVideo,
#remoteMediaVideo {
  width: 100%;
  height: 100%;
}

#screenVideo,
#remoteMediaVideo {
  display: block;

  object-fit: contain;

  background: black;
}

.controls {
  display: flex;
  gap: 8px;

  margin-top: 14px;
}

.controls input {
  flex: 1;

  min-width: 0;

  padding: 13px 14px;

  border: 1px solid #30333b;
  border-radius: 12px;

  color: white;
  background: #121418;
}

.buttonRow {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;

  margin-top: 14px;
}

.primary,
.secondary {
  min-height: 46px;

  padding: 11px 16px;

  border-radius: 12px;
}

.primary {
  border: 0;

  color: #111;
  background: white;

  font-weight: 700;
}

.secondary {
  border: 1px solid #34373f;

  color: white;
  background: #15171b;
}

.secondary.active {
  color: #111;
  background: white;

  font-weight: 700;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

.status {
  min-height: 24px;

  margin-top: 12px;

  opacity: .7;

  font-size: 13px;
  line-height: 1.4;
}

.debug {
  margin-top: 8px;

  opacity: .45;

  font-size: 11px;
  line-height: 1.5;

  word-break: break-word;
}

.hint {
  margin-bottom: 12px;

  padding: 12px 14px;

  border: 1px solid #30333b;
  border-radius: 13px;

  color: #ddd;
  background: #14161a;

  font-size: 13px;
  line-height: 1.45;
}

.callStage {
  position: relative;
}

.localPreview {
  position: absolute;

  right: 12px;
  bottom: 12px;

  width: min(28%, 180px);
  aspect-ratio: 3 / 4;

  overflow: hidden;

  border: 2px solid rgba(255,255,255,.8);
  border-radius: 15px;

  background: #111;

  box-shadow:
    0 12px 40px rgba(0,0,0,.5);

  z-index: 4;
}

#localMediaVideo {
  width: 100%;
  height: 100%;

  object-fit: cover;

  transform: scaleX(-1);
}

.emptyCall {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px;

  text-align: center;

  opacity: .5;

  pointer-events: none;
}

.rolePicker {
  display: none;

  width: min(420px, calc(100% - 32px));

  margin: 100px auto;

  text-align: center;
}

.rolePicker button {
  display: block;

  width: 100%;

  margin-top: 12px;

  padding: 15px;

  border: 0;
  border-radius: 13px;

  font-weight: 700;
}

@media (max-width: 650px) {
  header {
    display: block;
  }

  .presence {
    margin-top: 14px;
  }

  nav {
    grid-template-columns: 1fr;
  }

  .controls {
    flex-direction: column;
  }

  .controls button {
    width: 100%;
  }

  .buttonRow {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .buttonRow button {
    width: 100%;
  }

  .localPreview {
    right: 8px;
    bottom: 8px;

    width: 28%;
  }
}
</style>
</head>

<!-- SCREEN -->

  ></div>

<!-- CAMERA / VOICE -->

<section

>

      <video

    ></button>

  <div

  ></div>

  <div

</main>


<script>
const $ = id =>

/* =====================================================
   USER
===================================================== */

const params =
  new URLSearchParams(location.search);

const USER =
  params.get("user");

const IS_NEBUR =
  USER === "nebur";

const IS_NATALYA =

const OTHER_USER =
  IS_NEBUR
    ? "natalya"
    : "nebur";


function chooseUser(user) {
  location.search =
    "?user=" + user;
}


if (!IS_NEBUR && !IS_NATALYA) {

  $("rolePicker").style.display =
    "block";

} else {

  $("app").hidden =
    false;

}


/* =====================================================

const L =
  IS_NATALYA
    ? TEXT.ru
    : TEXT.es;


if (USER) {

  document.documentElement.lang =
    IS_NATALYA
      ? "ru"
      : "es";


  $("youtubeTab").textContent =
    L.youtube;

  $("screenTab").textContent =

  $("youtubeUrl").placeholder =

  $("loadYoutube").textContent =
    L.load;

}


/*
  Solo Nebur comparte pantalla
  desde el navegador.

  Natalya puede verla.
*/

if (IS_NEBUR) {

  $("viewerScreenControls").style.display =
    "none";

} else {

  $("youtubeControls").style.display =
    "none";

  $("hostScreenControls").style.display =
    "none";

}


/* =====================================================
   PANELS
===================================================== */

function showPanel(name) {

  const panels = [
    "youtube",
    "screen",
    "call"
  ];

  for (const item of panels) {

    $(item + "Panel")
      .classList.toggle(
        "active",
        item === name
      );

    $(item + "Tab")
      .classList.toggle(
        "active",
        item === name
      );

  }

}


/* =====================================================
   WEBSOCKET
===================================================== */

let socket = null;

let otherOnline = false;


function connectSocket() {

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      `${protocol}//${location.host}/ws?user=${USER}`
    );


  socket.onopen = () => {

    $("ytStatus").textContent =
      L.connected;

  };


  socket.onmessage = event => {

    let msg;

    try {

      msg =
        JSON.parse(event.data);

    } catch {

      return;

    }

    handleMessage(msg);

  };


  socket.onclose = () => {

    otherOnline =
      false;

    $("ytStatus").textContent =
      L.connecting;

    setTimeout(
      connectSocket,
      1200
    );

  };

}


function send(data) {

  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify(data)
    );

  }

}


function handleMessage(msg) {

  switch (msg.type) {

    case "presence":

      updatePresence(
        msg.users || []
      );

      break;


    case "yt-load":

      receiveYoutubeLoad(msg);

      break;


    case "yt-state":

      receiveYoutubeState(msg);

      break;


    case "rtc-offer":

      receiveRtcOffer(
        msg.channel,
        msg.sdp
      );

      break;


    case "rtc-answer":

      receiveRtcAnswer(
        msg.channel,
        msg.sdp
      );

      break;


    case "rtc-ice":

      receiveRtcIce(
        msg.channel,
        msg.candidate
      );

      break;


    case "screen-stop":

      stopRemoteScreen();

      break;


    case "media-stop":

      stopRemoteMedia(
        msg.channel
      );

      break;
  }

}


function updatePresence(users) {

  $("neburPresence")
    .classList.toggle(
      "online",
      users.includes("nebur")
    );


  $("natalyaPresence")
    .classList.toggle(
      "online",
      users.includes("natalya")
    );


  const wasOnline =
    otherOnline;


  otherOnline =
    users.includes(
      OTHER_USER
    );


  $("ytStatus").textContent =
    otherOnline
      ? L.connected
      : L.waiting;


  /*
    Si la otra persona entra después
    de que ya comenzaste a compartir,
    generamos una nueva oferta.
  */

  if (
    !wasOnline &&
    otherOnline
  ) {

    if (
      IS_NEBUR &&
      localScreenStream
    ) {

      startScreenOffer();

    }


    if (
      localMediaStream
    ) {

      startMediaOffer();

    }

  }

}


if (USER) {

  connectSocket();

}


/* =====================================================
   YOUTUBE
===================================================== */

let ytPlayer = null;

let ytReady = false;

let applyingRemoteYT = false;


window.onYouTubeIframeAPIReady =
  function () {

    ytPlayer =
      new YT.Player(
        "youtubePlayer",
        {

          playerVars: {

            playsinline: 1,

            rel: 0

          },


          events: {

            onReady() {

              ytReady =
                true;

            },


            onStateChange(event) {

              if (
                applyingRemoteYT
              ) {

                return;

              }


              if (
                event.data !==
                  YT.PlayerState.PLAYING
                &&
                event.data !==
                  YT.PlayerState.PAUSED
              ) {

                return;

              }


              send({

                type:
                  "yt-state",

                state:
                  event.data,

                time:
                  ytPlayer.getCurrentTime()

              });

            }

          }

        }
      );

  };


const youtubeScript =
  document.createElement(
    "script"
  );

youtubeScript.src =
  "https://www.youtube.com/iframe_api";

document.head.appendChild(
  youtubeScript
);


function extractYoutubeId(value) {

  try {

    const url =
      new URL(value);


    if (
      url.hostname.includes(
        "youtu.be"
      )
    ) {

      return url.pathname
        .slice(1)
        .split("/")[0];

    }


    const v =
      url.searchParams.get("v");


    if (v) {

      return v;

    }


    let match =
      url.pathname.match(
        /\/shorts\/([^/?]+)/
      );


    if (match) {

      return match[1];

    }


    match =
      url.pathname.match(
        /\/embed\/([^/?]+)/
      );


    if (match) {

      return match[1];

    }

  } catch {}


  if (
    /^[a-zA-Z0-9_-]{11}$/.test(
      value
    )
  ) {

    return value;

  }


  return null;

}


$("loadYoutube").onclick =
  function () {

    if (!ytReady) {

      return;

    }


    const id =
      extractYoutubeId(
        $("youtubeUrl")
          .value
          .trim()
      );


    if (!id) {

      $("ytStatus").textContent =
        L.invalidYoutube;

      return;

    }


    applyingRemoteYT =
      true;


    ytPlayer.cueVideoById(
      id
    );


    setTimeout(
      () => {

        applyingRemoteYT =
          false;

      },
      600
    );


    send({

      type:
        "yt-load",

      videoId:
        id,

      time:
        0

    });


    $("ytStatus").textContent =
      L.youtubeLoaded;

  };


function receiveYoutubeLoad(msg) {

  if (!ytReady) {

    setTimeout(
      () =>
        receiveYoutubeLoad(msg),
      300
    );

    return;

  }


  applyingRemoteYT =
    true;


  ytPlayer.cueVideoById({

    videoId:
      msg.videoId,

    startSeconds:
      msg.time || 0

  });


  setTimeout(
    () => {

      applyingRemoteYT =
        false;

    },
    600
  );

}


function receiveYoutubeState(msg) {

  if (
    !ytReady ||
    !ytPlayer
  ) {

    return;

  }


  applyingRemoteYT =
    true;


  const current =
    ytPlayer.getCurrentTime()
    || 0;


  if (
    Math.abs(
      current - msg.time
    ) > 1.25
  ) {

    ytPlayer.seekTo(
      msg.time,
      true
    );

  }


  if (
    msg.state ===
      YT.PlayerState.PLAYING
  ) {

    ytPlayer.playVideo();

  }


  if (
    msg.state ===
      YT.PlayerState.PAUSED
  ) {

    ytPlayer.pauseVideo();

  }


  setTimeout(
    () => {

      applyingRemoteYT =
        false;

    },
    600
  );

}


/*
  Nebur funciona como reloj maestro.
*/

setInterval(
  () => {

    if (
      !IS_NEBUR ||
      !ytReady ||
      !ytPlayer
    ) {

      return;

    }


    if (
      ytPlayer.getPlayerState()
      !==
      YT.PlayerState.PLAYING
    ) {

      return;

    }


    send({

      type:
        "yt-state",

      state:
        YT.PlayerState.PLAYING,

      time:
        ytPlayer.getCurrentTime()

    });

  },
  4000
);


/* =====================================================
   WEBRTC
===================================================== */

/*
  Primero intentamos conexión directa.

  TURN puede añadirse aquí después
  si las redes de ustedes lo requieren.
*/

const ICE_SERVERS = [

  {
    urls:
      "stun:stun.l.google.com:19302"
  },

  {
    urls:
      "stun:stun1.l.google.com:19302"
  }

];


const peers =
  new Map();


/*
  MUY IMPORTANTE:

  Los candidatos ICE pueden llegar ANTES
  de la oferta WebRTC.

  Por eso los guardamos aquí
  hasta tener remoteDescription.
*/

const pendingIce =
  new Map();


function debugScreen(text) {

  console.log(
    "[SCREEN]",
    text
  );


  $("screenDebug").textContent =
    text;

}


function debugCall(text) {

  console.log(
    "[CALL]",
    text
  );


  $("callDebug").textContent =
    text;

}


function closePeer(
  channel,
  clearIce = false
) {

  const pc =
    peers.get(channel);


  if (pc) {

    try {

      pc.close();

    } catch {}

  }


  peers.delete(
    channel
  );


  /*
    NO eliminamos candidatos ICE
    automáticamente.

    Ese era uno de los posibles bugs
    de la versión anterior.
  */

  if (clearIce) {

    pendingIce.delete(
      channel
    );

  }

}


function createPeer(
  channel,
  onTrack
) {

  /*
    Cerramos conexión anterior
    pero preservamos candidatos
    que hayan llegado antes.
  */

  closePeer(
    channel,
    false
  );


  const pc =
    new RTCPeerConnection({

      iceServers:
        ICE_SERVERS

    });


  peers.set(
    channel,
    pc
  );


  pc.onicecandidate =
    event => {

      if (
        !event.candidate
      ) {

        return;

      }


      send({

        type:
          "rtc-ice",

        channel,

        candidate:
          event.candidate

      });

    };


  pc.ontrack =
    event => {

      if (onTrack) {

        onTrack(event);

      }

    };


  pc.onconnectionstatechange =
    () => {

      const state =
        pc.connectionState;


      if (
        channel === "screen"
      ) {

        debugScreen(
          "WebRTC: " + state
        );

      } else {

        debugCall(
          channel +
          " · WebRTC: " +
          state
        );

      }


      if (
        state === "failed"
      ) {

        if (
          channel === "screen"
        ) {

          $("screenStatus").textContent =
            "WebRTC failed";

        }

      }

    };


  pc.oniceconnectionstatechange =
    () => {

      const state =
        pc.iceConnectionState;


      if (
        channel === "screen"
      ) {

        console.log(
          "[SCREEN ICE]",
          state
        );

      } else {

        console.log(
          "[MEDIA ICE]",
          channel,
          state
        );

      }

    };


  return pc;

}


async function flushIce(
  channel
) {

  const pc =
    peers.get(channel);


  if (!pc) {

    return;

  }


  const list =
    pendingIce.get(channel)
    || [];


  for (
    const candidate
    of list
  ) {

    try {

      await pc.addIceCandidate(
        candidate
      );

    } catch (error) {

      console.warn(
        "ICE flush error",
        error
      );

    }

  }


  pendingIce.set(
    channel,
    []
  );

}


/* =====================================================
   SCREEN SHARE
===================================================== */

let localScreenStream = null;


$("shareScreen").onclick =
  async function () {

    if (!IS_NEBUR) {

      return;

    }


    try {

      localScreenStream =
        await navigator
          .mediaDevices
          .getDisplayMedia({

            video: {

              frameRate: {
                ideal: 30,
                max: 30
              }

            },

            audio: true

          });


      /*
        Vista previa local
      */

      $("screenVideo").srcObject =
        localScreenStream;

      $("screenVideo").muted =
        true;


      try {

        await $("screenVideo").play();

      } catch {}


      const videoTrack =
        localScreenStream
          .getVideoTracks()[0];


      if (videoTrack) {

        videoTrack.onended =
          stopSharing;

      }


      $("shareScreen").disabled =
        true;

      $("stopScreen").disabled =
        false;


      $("screenStatus").textContent =
        L.sharing;


      await startScreenOffer();

    } catch (error) {

      console.error(
        "Screen capture error",
        error
      );


      $("screenStatus").textContent =
        L.screenError;

    }

  };


async function startScreenOffer() {

  if (
    !IS_NEBUR ||
    !localScreenStream
  ) {

    return;

  }


  debugScreen(
    "Creando conexión..."
  );


  const pc =
    createPeer(
      "screen"
    );


  for (
    const track
    of localScreenStream.getTracks()
  ) {

    pc.addTrack(
      track,
      localScreenStream
    );

  }


  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  /*
    Enviamos la oferta.
    Los ICE que se hayan adelantado
    ya estarán esperando en el otro lado.
  */

  send({

    type:
      "rtc-offer",

    channel:
      "screen",

    sdp:
      pc.localDescription

  });


  debugScreen(
    "Oferta enviada. Esperando viewer..."
  );

}


$("stopScreen").onclick =
  stopSharing;


function stopSharing() {

  if (
    localScreenStream
  ) {

    for (
      const track
      of localScreenStream.getTracks()
    ) {

      track.stop();

    }

  }


  localScreenStream =
    null;


  closePeer(
    "screen",
    true
  );


  $("screenVideo").srcObject =
    null;


  $("shareScreen").disabled =
    false;

  $("stopScreen").disabled =
    true;


  $("screenStatus").textContent =
    L.screenStopped;


  debugScreen(
    "Screen stopped"
  );


  send({

    type:
      "screen-stop"

  });

}


function stopRemoteScreen() {

  closePeer(
    "screen",
    true
  );


  $("screenVideo").srcObject =
    null;


  $("screenStatus").textContent =
    L.screenStopped;


  debugScreen(
    "Remote screen stopped"
  );

}


/*
  Botón de reproducción manual.

  Útil en Android / iPhone.
*/

$("playScreenButton").onclick =
  async function () {

    const video =
      $("screenVideo");


    if (!video.srcObject) {

      $("screenStatus").textContent =
        L.screenWaiting;

      return;

    }


    video.muted =
      true;


    try {

      await video.play();


      $("screenStatus").textContent =
        L.screenReceived;

    } catch (error) {

      console.error(
        "Screen play error",
        error
      );

    }

  };


$("screenSoundButton").onclick =
  async function () {

    const video =
      $("screenVideo");


    if (!video.srcObject) {

      $("screenStatus").textContent =
        L.screenWaiting;

      return;

    }


    video.muted =
      false;


    try {

      await video.play();


      $("screenStatus").textContent =
        IS_NATALYA
          ? "Экран и звук подключены ✓"
          : "Pantalla y sonido activos ✓";

    } catch (error) {

      console.error(
        "Screen audio error",
        error
      );

    }

  };


/* =====================================================
   CAMERA + MICROPHONE
===================================================== */

const MEDIA_CHANNEL =
  USER + "-media";


const REMOTE_MEDIA_CHANNEL =
  OTHER_USER + "-media";


let micEnabled =
  false;

let cameraEnabled =
  false;

let localMediaStream =
  null;


$("micButton").onclick =
  async function () {

    micEnabled =
      !micEnabled;


    await restartOutgoingMedia();

};


$("cameraButton").onclick =
  async function () {

    cameraEnabled =
      !cameraEnabled;


    await restartOutgoingMedia();

};


function updateMediaButtons() {

  $("micButton").textContent =
    micEnabled
      ? L.micOn
      : L.micOff;


  $("cameraButton").textContent =
    cameraEnabled
      ? L.cameraOn
      : L.cameraOff;


  $("micButton")
    .classList.toggle(
      "active",
      micEnabled
    );


  $("cameraButton")
    .classList.toggle(
      "active",
      cameraEnabled
    );

}


function stopLocalMediaTracks() {

  if (
    localMediaStream
  ) {

    for (
      const track
      of localMediaStream
        .getTracks()
    ) {

      track.stop();

    }

  }


  localMediaStream =
    null;


  $("localMediaVideo").srcObject =
    null;

}


async function restartOutgoingMedia() {

  stopLocalMediaTracks();


  closePeer(
    MEDIA_CHANNEL,
    true
  );


  send({

    type:
      "media-stop",

    channel:
      MEDIA_CHANNEL

  });


  if (
    !micEnabled &&
    !cameraEnabled
  ) {

    $("localPreview").hidden =
      true;


    $("callStatus").textContent =
      L.callOff;


    updateMediaButtons();

    return;

  }


  try {

    localMediaStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:
            micEnabled,

          video:
            cameraEnabled
              ? {
                  facingMode:
                    "user"
                }
              : false

        });

  } catch (error) {

    console.error(
      "getUserMedia error",
      error
    );


    micEnabled =
      false;

    cameraEnabled =
      false;


    updateMediaButtons();


    $("callStatus").textContent =
      L.permissionError;


    return;

  }


  $("localMediaVideo").srcObject =
    localMediaStream;


  $("localPreview").hidden =
    !cameraEnabled;


  updateMediaButtons();


  await startMediaOffer();

}


async function startMediaOffer() {

  if (!localMediaStream) {

    return;

  }


  const pc =
    createPeer(
      MEDIA_CHANNEL
    );


  for (
    const track
    of localMediaStream
      .getTracks()
  ) {

    pc.addTrack(
      track,
      localMediaStream
    );

  }


  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  send({

    type:
      "rtc-offer",

    channel:
      MEDIA_CHANNEL,

    sdp:
      pc.localDescription

  });


  $("callStatus").textContent =
    L.callLive;

}


/* =====================================================
   RECEIVE OFFER
===================================================== */

async function receiveRtcOffer(
  channel,
  sdp
) {

  if (
    !channel ||
    !sdp
  ) {

    return;

  }


  let onTrack =
    null;


  /*
    Pantalla de Nebur
  */

  if (
    channel === "screen"
  ) {

    onTrack =
      async event => {

        const stream =
          event.streams[0];


        if (!stream) {

          return;

        }


        const video =
          $("screenVideo");


        video.srcObject =
          stream;


        /*
          Empezamos muteado para que
          Android/iOS permitan autoplay.
        */

        video.muted =
          true;


        $("screenStatus").textContent =
          L.screenReceived;


        debugScreen(
          "MediaStream recibido ✓"
        );


        try {

          await video.play();


          debugScreen(
            "Vídeo reproduciendo ✓"
          );

        } catch (error) {

          debugScreen(
            "Stream recibido. Pulsa reproducir."
          );

        }

      };

  }


  /*
    Cámara / micrófono del otro usuario
  */

  if (
    channel ===
      REMOTE_MEDIA_CHANNEL
  ) {

    onTrack =
      async event => {

        const stream =
          event.streams[0];


        if (!stream) {

          return;

        }


        const video =
          $("remoteMediaVideo");


        video.srcObject =
          stream;


        $("emptyCall").style.display =
          "none";


        try {

          await video.play();

        } catch {}


        $("callStatus").textContent =
          L.callLive;

      };

  }


  const pc =
    createPeer(
      channel,
      onTrack
    );


  try {

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        sdp
      )
    );


    /*
      Ahora que tenemos descripción remota,
      añadimos los ICE que llegaron antes.
    */

    await flushIce(
      channel
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    send({

      type:
        "rtc-answer",

      channel,

      sdp:
        pc.localDescription

    });


    if (
      channel === "screen"
    ) {

      debugScreen(
        "Oferta recibida. Respuesta enviada ✓"
      );

    }

  } catch (error) {

    console.error(
      "RTC offer error",
      error
    );


    if (
      channel === "screen"
    ) {

      debugScreen(
        "Error en oferta: " +
        error.message
      );

    }

  }

}


/* =====================================================
   RECEIVE ANSWER
===================================================== */

async function receiveRtcAnswer(
  channel,
  sdp
) {

  const pc =
    peers.get(channel);


  if (
    !pc ||
    !sdp
  ) {

    return;

  }


  try {

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        sdp
      )
    );


    await flushIce(
      channel
    );


    if (
      channel === "screen"
    ) {

      debugScreen(
        "Respuesta recibida ✓"
      );

    }

  } catch (error) {

    console.error(
      "RTC answer error",
      error
    );

  }

}


/* =====================================================
   RECEIVE ICE
===================================================== */

async function receiveRtcIce(
  channel,
  candidate
) {

  if (
    !channel ||
    !candidate
  ) {

    return;

  }


  const ice =
    new RTCIceCandidate(
      candidate
    );


  const pc =
    peers.get(channel);


  /*
    Si todavía no existe peer
    o no tenemos descripción remota,
    guardamos el candidato.
  */

  if (
    !pc ||
    !pc.remoteDescription
  ) {

    const list =
      pendingIce.get(channel)
      || [];


    list.push(
      ice
    );


    pendingIce.set(
      channel,
      list
    );


    if (
      channel === "screen"
    ) {

      debugScreen(
        "ICE guardado temporalmente..."
      );

    }


    return;

  }


  try {

    await pc.addIceCandidate(
      ice
    );

  } catch (error) {

    console.warn(
      "ICE error",
      error
    );

  }

}


/* =====================================================
   MEDIA STOP
===================================================== */

function stopRemoteMedia(
  channel
) {

  if (
    channel !==
      REMOTE_MEDIA_CHANNEL
  ) {

    return;

  }


  closePeer(
    channel,
    true
  );


  $("remoteMediaVideo").srcObject =
    null;


  $("emptyCall").style.display =
    "flex";


  $("callStatus").textContent =
    L.remoteStopped;

}


/* =====================================================
   ENABLE AUDIO
===================================================== */

$("enableSound").onclick =
  async function () {

    const video =
      $("remoteMediaVideo");


    video.muted =
      false;


    try {

      await video.play();


      $("callStatus").textContent =
        L.soundEnabled;

    } catch (error) {

      console.error(
        "Remote audio play error",
        error
      );

    }

  };


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    stopLocalMediaTracks();


    if (
      localScreenStream
    ) {

      for (
        const track
        of localScreenStream.getTracks()
      ) {

        track.stop();

      }

    }


    for (
      const pc
      of peers.values()
    ) {

      try {

        pc.close();

      } catch {}

    }

  }
);
</script>
