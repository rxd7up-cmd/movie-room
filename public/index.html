<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>Moscow ↔ Samara</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #08090b;
      color: #f4f4f4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, #252830 0, transparent 35%),
        #08090b;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 1100px;
      margin: auto;

      padding:
        max(20px, env(safe-area-inset-top))
        16px
        max(30px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .16em;
      opacity: .5;
    }

    h1 {
      margin: 4px 0 0;
      font-size: clamp(25px, 6vw, 40px);
    }

    .presence {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .person {
      padding: 8px 11px;
      border: 1px solid #303239;
      border-radius: 999px;
      opacity: .45;
      font-size: 13px;
    }

    .person.online {
      opacity: 1;
      border-color: #777c86;
    }

    .person.online::before {
      content: "●";
      margin-right: 6px;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    nav button {
      min-height: 48px;
      padding: 10px;
      border: 1px solid #292c32;
      border-radius: 13px;
      background: #14161a;
      color: white;
    }

    nav button.active {
      background: white;
      color: #111;
      font-weight: 700;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .videoShell {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid #292c32;
      border-radius: 18px;
      background: #000;
    }

    #youtubePlayer,
    #youtubePlayer iframe,
    #screenVideo,
    #remoteMediaVideo {
      display: block;
      width: 100%;
      height: 100%;
    }

    #screenVideo,
    #remoteMediaVideo {
      object-fit: contain;
      background: black;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .controls input {
      flex: 1;
      min-width: 0;

      padding: 13px 14px;

      border: 1px solid #303239;
      border-radius: 12px;

      background: #121418;
      color: white;
    }

    .primary,
    .secondary {
      min-height: 46px;
      padding: 11px 16px;
      border-radius: 12px;
    }

    .primary {
      border: 0;
      background: white;
      color: #111;
      font-weight: 700;
    }

    .secondary {
      border: 1px solid #303239;
      background: #15171b;
      color: white;
    }

    .secondary.active {
      background: white;
      color: #111;
      font-weight: 700;
    }

    .buttonRow {
      display: flex;
      gap: 9px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      font-size: 13px;
      opacity: .68;
    }

    .hint {
      margin: 12px 0;
      padding: 12px 14px;

      border: 1px solid #303239;
      border-radius: 13px;

      background: #14161a;

      font-size: 13px;
      line-height: 1.45;
    }

    .callStage {
      position: relative;
    }

    .localPreview {
      position: absolute;
      right: 12px;
      bottom: 12px;

      width: min(28%, 180px);
      aspect-ratio: 3 / 4;

      overflow: hidden;

      border: 2px solid rgba(255,255,255,.75);
      border-radius: 15px;

      background: #111;

      box-shadow: 0 10px 40px rgba(0,0,0,.45);

      z-index: 3;
    }

    #localMediaVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .emptyCall {
      position: absolute;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;

      text-align: center;
      opacity: .55;
      pointer-events: none;
    }

    .rolePicker {
      display: none;
      max-width: 420px;
      margin: 100px auto;
      padding: 20px;
      text-align: center;
    }

    .rolePicker button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      font-weight: 700;
    }

    @media (max-width: 650px) {
      header {
        display: block;
      }

      .presence {
        margin-top: 14px;
      }

      nav {
        grid-template-columns: 1fr;
      }

      .controls {
        flex-direction: column;
      }

      .controls button {
        width: 100%;
      }

      .buttonRow {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .buttonRow button {
        width: 100%;
      }

      .localPreview {
        width: 27%;
        right: 8px;
        bottom: 8px;
      }
    }
  </style>
</head>

<body>

<div id="rolePicker" class="rolePicker">

  <h2>Moscow ↔ Samara</h2>

  <button onclick="chooseUser('nebur')">
    Nebur · Español
  </button>

</div>


<main id="app" class="app" hidden>

  <header>

    <div>

      </div>

  </header>


  <nav>

    <button
      id="youtubeTab"

    <button

  </nav>


  <!-- ===================== -->
  <!-- YOUTUBE -->
  <!-- ===================== -->

  <section
    id="youtubePanel"
    class="panel active"
  >

    <div class="videoShell">
      <div id="youtubePlayer"></div>
    </div>

    <div
      id="youtubeControls"
      class="controls"
    >

      <input
        id="youtubeUrl"
        type="text"
        autocomplete="off"
      >

      <button
        id="loadYoutube"
        class="primary"
      ></button>

    </div>

    <div
      id="ytStatus"
      class="status"
    ></div>

  </section>


  <!-- ===================== -->
  <!-- SCREEN -->
  <!-- ===================== -->

  <section
    id="screenPanel"
    class="panel"
  >

    <div
      id="screenHint"
      class="hint"
    ></div>

    <div class="videoShell">

      <video
        id="screenVideo"
        autoplay
        playsinline
        controls
      ></video>

    </div>

    <div
      id="hostScreenControls"
      class="buttonRow"
    >

      <button
        id="shareScreen"
        class="primary"
      ></button>

      <button
        id="stopScreen"
        class="secondary"
        disabled
      ></button>

    </div>

    <div
      id="screenStatus"
      class="status"
    ></div>

  </section>


  <!-- ===================== -->
  <!-- CAMERA / VOICE -->
  <!-- ===================== -->

  <section
    id="callPanel"
    class="panel"
  >

    <div class="callStage">

      <div class="videoShell">

        <video
          id="remoteMediaVideo"
          autoplay
          playsinline
          controls
        ></video>

        <div
          id="emptyCall"
          class="emptyCall"
        ></div>

      </div>


      <div
        id="localPreview"
        class="localPreview"
        hidden
      >

        <video
          id="localMediaVideo"
          autoplay
          playsinline
          muted
        ></video>

      </div>

    </div>


    <div class="buttonRow">

      <button
        id="cameraButton"
        class="secondary"
      ></button>

      <button
        id="micButton"
        class="secondary"
      ></button>

      <button
        id="enableSound"
        class="secondary"
      ></button>

    </div>

    <div
      id="callStatus"
      class="status"
    ></div>

  </section>

</main>


<script>

/* =========================================================
   BASIC
========================================================= */

const $ = id =>
  document.getElementById(id);


const params =
  new URLSearchParams(location.search);


const USER =
  params.get("user");


const IS_NEBUR =
  USER === "nebur";


const IS_NATALYA =
  USER === "natalya";


const OTHER_USER =
  IS_NEBUR
    ? "natalya"
    : "nebur";


const MEDIA_CHANNEL =
  USER + "-media";


const REMOTE_MEDIA_CHANNEL =
  OTHER_USER + "-media";


function chooseUser(user) {

  location.search =
    "?user=" + user;

}


if (
  !IS_NEBUR &&
  !IS_NATALYA
) {

  $("rolePicker").style.display =
    "block";

} else {

  $("app").hidden =
    false;

}


/* =========================================================
   TRANSLATIONS
========================================================= */

const TEXT = {

  es: {

    youtube:
      "YouTube juntos",

    screen:
      "Compartir pantalla",

    call:
      "Cámara y voz",

    youtubePlaceholder:

    load:
      "Ver juntos",

    connecting:
      "Conectando…",

    connected:
      "Sala conectada ✓",

    waitingNatalya:

    youtubeLoaded:

    invalidYoutube:
      "No pude reconocer ese enlace de YouTube.",

    screenHint:
      "Comparte preferiblemente una pestaña de Chrome o Edge y activa «Compartir audio de la pestaña».",

      "Compartir pantalla + audio",

    stopShare:
      "Dejar de compartir",

    sharing:
      "Estás compartiendo tu pantalla ✓",

    remoteSharing:

    screenStopped:
      "La transmisión de pantalla terminó.",

    screenError:
      "No se pudo compartir la pantalla.",

    cameraOff:
      "Encender cámara",

    micOn:
      "Silenciar micrófono",

    micOff:
      "Encender micrófono",

    enableSound:
      "Activar sonido",

    emptyCall:
      "Activa cámara o micrófono para comenzar.",

    callLive:

    callOff:

    permissionError:
      "No pude acceder a la cámara o al micrófono. Revisa los permisos del navegador.",

    soundEnabled:
      "Sonido activado ✓"
  },


  ru: {

    youtube:
      "YouTube вместе",

    screen:
      "Экран Nebur",

    call:
      "Камера и голос",

    youtubePlaceholder:
      "Ссылка на YouTube…",

    load:
      "Смотреть вместе",

    connecting:
      "Подключение…",

    connected:
      "Комната подключена ✓",

    waitingNatalya:
      "Ожидание Nebur…",

    youtubeLoaded:
      "Видео синхронизировано ✓",

    invalidYoutube:
      "Не удалось распознать ссылку YouTube.",

    screenHint:
      "Здесь можно смотреть экран Nebur. Если звук не запускается автоматически, нажмите кнопку ▶ на видео.",

    share:
      "Поделиться экраном и звуком",

    stopShare:
      "Остановить трансляцию",

    sharing:
      "Идёт трансляция экрана ✓",

    remoteSharing:
      "Nebur делится экраном ✓",

    screenStopped:
      "Трансляция экрана завершена.",

    screenError:

      "Включите камеру или микрофон, чтобы начать.",

    callLive:
      "Камера / голос подключены ✓",

    callOff:
      "Камера и микрофон выключены.",

    remoteMediaStopped:
      "Nebur выключил камеру и микрофон.",

    permissionError:
      "Нет доступа к камере или микрофону. Проверьте разрешения Safari.",

    soundEnabled:
      "Звук включён ✓"
  }

};


const L =
  IS_NATALYA
    ? TEXT.ru
    : TEXT.es;


if (USER) {

  document.documentElement.lang =
    IS_NATALYA
      ? "ru"
      : "es";


  $("youtubeTab").textContent =
    L.youtube;

  $("screenTab").textContent =
    L.screen;

  $("callTab").textContent =
    L.call;


  $("youtubeUrl").placeholder =
    L.youtubePlaceholder;

  $("loadYoutube").textContent =
    L.load;


  $("shareScreen").textContent =
    L.share;

  $("stopScreen").textContent =
    L.stopShare;


  $("screenHint").textContent =
    L.screenHint;


  $("cameraButton").textContent =
    L.cameraOff;

  $("micButton").textContent =
    L.micOff;

  $("enableSound").textContent =
    L.enableSound;


  $("emptyCall").textContent =
    L.emptyCall;


  $("ytStatus").textContent =
    L.connecting;

  $("screenStatus").textContent =
    L.connecting;

  $("callStatus").textContent =
    L.callOff;

}


/*
Natalya no puede iniciar screen capture
desde Safari de iPhone.

Pero sí puede recibir tu pantalla.
*/

if (IS_NATALYA) {

  $("youtubeControls").style.display =
    "none";

  $("hostScreenControls").style.display =
    "none";

}


/* =========================================================
   PANELS
========================================================= */

function showPanel(name) {

  const names =
    ["youtube", "screen", "call"];


  for (const item of names) {

    $(
      item + "Panel"
    ).classList.toggle(
      "active",
      item === name
    );


    $(
      item + "Tab"
    ).classList.toggle(
      "active",
      item === name
    );

  }

}


/* =========================================================
   WEBSOCKET
========================================================= */

let socket;


function connectSocket() {

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      `${protocol}//${location.host}/ws?user=${USER}`
    );


  socket.onopen = () => {

    $("ytStatus").textContent =
      L.connected;

    $("screenStatus").textContent =
      L.connected;

  };


  socket.onmessage = event => {

    let msg;

    try {

      msg =
        JSON.parse(event.data);

    } catch {

      return;

    }

    handleMessage(msg);

  };


  socket.onclose = () => {

    $("ytStatus").textContent =
      L.connecting;

    $("screenStatus").textContent =
      L.connecting;

    setTimeout(
      connectSocket,
      1500
    );

  };

}


function send(data) {

  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify(data)
    );

  }

}


function handleMessage(msg) {

  if (msg.type === "presence") {

    updatePresence(
      msg.users || []
    );

    return;

  }


  if (msg.type === "yt-load") {

    receiveYoutubeLoad(msg);

    return;

  }


  if (msg.type === "yt-state") {

    receiveYoutubeState(msg);

    return;

  }


  if (msg.type === "rtc-offer") {

    receiveRtcOffer(
      msg.channel,
      msg.sdp
    );

    return;

  }


  if (msg.type === "rtc-answer") {

    receiveRtcAnswer(
      msg.channel,
      msg.sdp
    );

    return;

  }


  if (msg.type === "rtc-ice") {

    receiveRtcIce(
      msg.channel,
      msg.candidate
    );

    return;

  }


  if (msg.type === "screen-stop") {

    stopRemoteScreen();

    return;

  }


  if (msg.type === "media-stop") {

    stopRemoteMedia(
      msg.channel
    );

  }

}


function updatePresence(users) {

  $("neburPresence")
    .classList.toggle(
      "online",
      users.includes("nebur")
    );


  $("natalyaPresence")
    .classList.toggle(
      "online",
      users.includes("natalya")
    );


  if (!users.includes(OTHER_USER)) {

    $("ytStatus").textContent =
      L.waitingNatalya;

  } else {

    $("ytStatus").textContent =
      L.connected;

  }

}


if (USER) {

  connectSocket();

}


/* =========================================================
   YOUTUBE
========================================================= */

let ytPlayer;

let ytReady =
  false;

let applyingRemoteYT =
  false;


window.onYouTubeIframeAPIReady =
  () => {

    ytPlayer =
      new YT.Player(
        "youtubePlayer",
        {

          height:
            "100%",

          width:
            "100%",

          playerVars: {

            playsinline: 1,

            rel: 0

          },

          events: {

            onReady() {

              ytReady =
                true;

            },


            onStateChange(event) {

              if (
                applyingRemoteYT
              ) {

                return;

              }


              if (
                event.data !==
                  YT.PlayerState.PLAYING
                &&
                event.data !==
                  YT.PlayerState.PAUSED
              ) {

                return;

              }


              send({

                type:
                  "yt-state",

                state:
                  event.data,

                time:
                  ytPlayer.getCurrentTime()

              });

            },


            onAutoplayBlocked() {

              if (IS_NATALYA) {

                $("ytStatus").textContent =
                  "Нажмите ▶ один раз для запуска видео.";

              }

            }

          }

        }
      );

  };


const youtubeScript =
  document.createElement(
    "script"
  );


youtubeScript.src =
  "https://www.youtube.com/iframe_api";


document.head.appendChild(
  youtubeScript
);


function extractYoutubeId(value) {

  try {

    const url =
      new URL(value);


    if (
      url.hostname.includes(
        "youtu.be"
      )
    ) {

      return url.pathname
        .slice(1)
        .split("/")[0];

    }


    if (
      url.searchParams.get("v")
    ) {

      return url.searchParams.get(
        "v"
      );

    }


    const shorts =
      url.pathname.match(
        /\/shorts\/([^/?]+)/
      );


    if (shorts) {

      return shorts[1];

    }


    const embed =
      url.pathname.match(
        /\/embed\/([^/?]+)/
      );


    if (embed) {

      return embed[1];

    }

  } catch {}


  if (
    /^[a-zA-Z0-9_-]{11}$/.test(
      value
    )
  ) {

    return value;

  }


  return null;

}


$("loadYoutube").onclick =
  () => {

    if (!ytReady) {

      return;

    }


    const id =
      extractYoutubeId(
        $("youtubeUrl")
          .value
          .trim()
      );


    if (!id) {

      $("ytStatus").textContent =
        L.invalidYoutube;

      return;

    }


    applyingRemoteYT =
      true;


    ytPlayer.cueVideoById(
      id
    );


    setTimeout(
      () => {

        applyingRemoteYT =
          false;

      },
      700
    );


    send({

      type:
        "yt-load",

      videoId:
        id,

      time:
        0

    });


    $("ytStatus").textContent =
      L.youtubeLoaded;

  };


function receiveYoutubeLoad(msg) {

  if (!ytReady) {

    setTimeout(
      () =>
        receiveYoutubeLoad(msg),
      400
    );

    return;

  }


  applyingRemoteYT =
    true;


  ytPlayer.cueVideoById({

    videoId:
      msg.videoId,

    startSeconds:
      msg.time || 0

  });


  setTimeout(
    () => {

      applyingRemoteYT =
        false;

    },
    700
  );

}


function receiveYoutubeState(msg) {

  if (!ytReady) {

    return;

  }


  applyingRemoteYT =
    true;


  const current =
    ytPlayer.getCurrentTime()
    || 0;


  if (
    Math.abs(
      current - msg.time
    ) > 1.2
  ) {

    ytPlayer.seekTo(
      msg.time,
      true
    );

  }


  if (
    msg.state ===
      YT.PlayerState.PLAYING
  ) {

    ytPlayer.playVideo();

  }


  if (
    msg.state ===
      YT.PlayerState.PAUSED
  ) {

    ytPlayer.pauseVideo();

  }


  setTimeout(
    () => {

      applyingRemoteYT =
        false;

    },
    700
  );

}


/*
Nebur sirve como reloj principal
cada 4 segundos.
*/

setInterval(
  () => {

    if (
      !IS_NEBUR ||
      !ytReady ||
      !ytPlayer
    ) {

      return;

    }


    if (
      ytPlayer.getPlayerState()
      !==
      YT.PlayerState.PLAYING
    ) {

      return;

    }


    send({

      type:
        "yt-state",

      state:
        YT.PlayerState.PLAYING,

      time:
        ytPlayer.getCurrentTime()

    });

  },
  4000
);


/* =========================================================
   WEBRTC
========================================================= */

const ICE_SERVERS = [

  {
    urls:
      "stun:stun.l.google.com:19302"
  }

];


const peers =
  new Map();


const pendingIce =
  new Map();


function closePeer(channel) {

  const pc =
    peers.get(channel);


  if (pc) {

    try {

      pc.close();

    } catch {}

  }


  peers.delete(channel);

  pendingIce.delete(channel);

}


function createPeer(
  channel,
  onTrack
) {

  closePeer(channel);


  const pc =
    new RTCPeerConnection({

      iceServers:
        ICE_SERVERS

    });


  peers.set(
    channel,
    pc
  );


  pc.onicecandidate =
    event => {

      if (
        !event.candidate
      ) {

        return;

      }


      send({

        type:
          "rtc-ice",

        channel,

        candidate:
          event.candidate

      });

    };


  pc.ontrack =
    event => {

      if (onTrack) {

        onTrack(event);

      }

    };


  return pc;

}


async function flushIce(
  channel
) {

  const pc =
    peers.get(channel);


  if (!pc) {

    return;

  }


  const list =
    pendingIce.get(channel)
    || [];


  for (
    const candidate
    of list
  ) {

    try {

      await pc.addIceCandidate(
        candidate
      );

    } catch {}

  }


  pendingIce.set(
    channel,
    []
  );

}


/* =========================================================
   SCREEN SHARE
========================================================= */

let localScreenStream =
  null;


$("shareScreen").onclick =
  async () => {

    if (!IS_NEBUR) {

      return;

    }


    try {

      localScreenStream =
        await navigator
          .mediaDevices
          .getDisplayMedia({

            video: true,

            audio: true

          });


      const pc =
        createPeer(
          "screen"
        );


      for (
        const track
        of localScreenStream
          .getTracks()
      ) {

        pc.addTrack(
          track,
          localScreenStream
        );

      }


      $("screenVideo").srcObject =
        localScreenStream;

      $("screenVideo").muted =
        true;


      const videoTrack =
        localScreenStream
          .getVideoTracks()[0];


      if (videoTrack) {

        videoTrack.onended =
          stopSharing;

      }


      const offer =
        await pc.createOffer();


      await pc.setLocalDescription(
        offer
      );


      send({

        type:
          "rtc-offer",

        channel:
          "screen",

        sdp:
          pc.localDescription

      });


      $("shareScreen").disabled =
        true;

      $("stopScreen").disabled =
        false;


      $("screenStatus").textContent =
        L.sharing;

    } catch (error) {

      console.error(
        error
      );


      $("screenStatus").textContent =
        L.screenError;

    }

  };


$("stopScreen").onclick =
  stopSharing;


function stopSharing() {

  if (
    localScreenStream
  ) {

    for (
      const track
      of localScreenStream
        .getTracks()
    ) {

      track.stop();

    }

  }


  localScreenStream =
    null;


  closePeer(
    "screen"
  );


  $("screenVideo").srcObject =
    null;


  $("shareScreen").disabled =
    false;

  $("stopScreen").disabled =
    true;


  $("screenStatus").textContent =
    L.screenStopped;


  send({

    type:
      "screen-stop"

  });

}


function stopRemoteScreen() {

  closePeer(
    "screen"
  );


  $("screenVideo").srcObject =
    null;


  $("screenStatus").textContent =
    L.screenStopped;

}


/* =========================================================
   CAMERA + MICROPHONE
========================================================= */

let micEnabled =
  false;

let cameraEnabled =
  false;

let localMediaStream =
  null;


async function toggleMicrophone() {

  const previous =
    micEnabled;


  micEnabled =
    !micEnabled;


  try {

    await restartOutgoingMedia();

  } catch {

    micEnabled =
      previous;

    updateMediaButtons();

  }

}


async function toggleCamera() {

  const previous =
    cameraEnabled;


  cameraEnabled =
    !cameraEnabled;


  try {

    await restartOutgoingMedia();

  } catch {

    cameraEnabled =
      previous;

    updateMediaButtons();

  }

}


$("micButton").onclick =
  toggleMicrophone;


$("cameraButton").onclick =
  toggleCamera;


function updateMediaButtons() {

  $("micButton").textContent =
    micEnabled
      ? L.micOn
      : L.micOff;


  $("cameraButton").textContent =
    cameraEnabled
      ? L.cameraOn
      : L.cameraOff;


  $("micButton").classList.toggle(
    "active",
    micEnabled
  );


  $("cameraButton").classList.toggle(
    "active",
    cameraEnabled
  );

}


function stopLocalMediaTracks() {

  if (
    localMediaStream
  ) {

    for (
      const track
      of localMediaStream
        .getTracks()
    ) {

      track.stop();

    }

  }


  localMediaStream =
    null;


  $("localMediaVideo").srcObject =
    null;

}


async function restartOutgoingMedia() {

  stopLocalMediaTracks();


  closePeer(
    MEDIA_CHANNEL
  );


  /*
  Decimos al otro que cierre
  la conexión anterior.
  */

  send({

    type:
      "media-stop",

    channel:
      MEDIA_CHANNEL

  });


  if (
    !micEnabled &&
    !cameraEnabled
  ) {

    $("localPreview").hidden =
      true;


    $("callStatus").textContent =
      L.callOff;


    updateMediaButtons();

    return;

  }


  try {

    localMediaStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:
            micEnabled,

          video:
            cameraEnabled
              ? {
                  facingMode:
                    "user"
                }
              : false

        });

  } catch (error) {

    console.error(
      error
    );


    $("callStatus").textContent =
      L.permissionError;


    throw error;

  }


  $("localMediaVideo").srcObject =
    localMediaStream;


  $("localPreview").hidden =
    !cameraEnabled;


  const pc =
    createPeer(
      MEDIA_CHANNEL
    );


  for (
    const track
    of localMediaStream
      .getTracks()
  ) {

    pc.addTrack(
      track,
      localMediaStream
    );

  }


  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  send({

    type:
      "rtc-offer",

    channel:
      MEDIA_CHANNEL,

    sdp:
      pc.localDescription

  });


  $("callStatus").textContent =
    L.callLive;


  updateMediaButtons();

}


/* =========================================================
   RECEIVE RTC OFFER
========================================================= */

async function receiveRtcOffer(
  channel,
  sdp
) {

  if (
    !channel ||
    !sdp
  ) {

    return;

  }


  let onTrack =
    null;


  if (
    channel === "screen"
  ) {

    onTrack =
      event => {

        const stream =
          event.streams[0];


        if (!stream) {

          return;

        }


        $("screenVideo").srcObject =
          stream;


        $("screenVideo")
          .play()
          .catch(() => {});


        $("screenStatus").textContent =
          L.remoteSharing;

      };

  }


  if (
    channel ===
      REMOTE_MEDIA_CHANNEL
  ) {

    onTrack =
      event => {

        const stream =
          event.streams[0];


        if (!stream) {

          return;

        }


        $("remoteMediaVideo")
          .srcObject =
            stream;


        $("emptyCall").style.display =
          "none";


        $("remoteMediaVideo")
          .play()
          .catch(() => {});


        $("callStatus").textContent =
          L.callLive;

      };

  }


  const pc =
    createPeer(
      channel,
      onTrack
    );


  try {

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        sdp
      )
    );


    await flushIce(
      channel
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    send({

      type:
        "rtc-answer",

      channel,

      sdp:
        pc.localDescription

    });

  } catch (error) {

    console.error(
      "RTC offer error:",
      error
    );

  }

}


/* =========================================================
   RECEIVE RTC ANSWER
========================================================= */

async function receiveRtcAnswer(
  channel,
  sdp
) {

  const pc =
    peers.get(channel);


  if (
    !pc ||
    !sdp
  ) {

    return;

  }


  try {

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        sdp
      )
    );


    await flushIce(
      channel
    );

  } catch (error) {

    console.error(
      "RTC answer error:",
      error
    );

  }

}


/* =========================================================
   RECEIVE ICE
========================================================= */

async function receiveRtcIce(
  channel,
  candidate
) {

  if (
    !channel ||
    !candidate
  ) {

    return;

  }


  const ice =
    new RTCIceCandidate(
      candidate
    );


  const pc =
    peers.get(channel);


  if (
    !pc ||
    !pc.remoteDescription
  ) {

    const list =
      pendingIce.get(channel)
      || [];


    list.push(
      ice
    );


    pendingIce.set(
      channel,
      list
    );


    return;

  }


  try {

    await pc.addIceCandidate(
      ice
    );

  } catch (error) {

    console.warn(
      "ICE error:",
      error
    );

  }

}


/* =========================================================
   REMOTE MEDIA STOP
========================================================= */

function stopRemoteMedia(
  channel
) {

  if (
    channel !==
      REMOTE_MEDIA_CHANNEL
  ) {

    return;

  }


  closePeer(
    channel
  );


  $("remoteMediaVideo").srcObject =
    null;


  $("emptyCall").style.display =
    "flex";


  $("callStatus").textContent =
    L.remoteMediaStopped;

}


/* =========================================================
   ENABLE SOUND
========================================================= */

$("enableSound").onclick =
  async () => {

    const videos = [

      $("screenVideo"),

      $("remoteMediaVideo")

    ];


    for (
      const video
      of videos
    ) {

      if (
        video.srcObject
      ) {

        try {

          video.muted =
            false;


          await video.play();

        } catch {}

      }

    }


    $("callStatus").textContent =
      L.soundEnabled;

  };


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    stopLocalMediaTracks();


    for (
      const pc
      of peers.values()
    ) {

      try {

        pc.close();

      } catch {}

    }

  }
);

</script>
